name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only keep the most recent run per ref (branches/PRs); never cancel a tag build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Compile the Blockly Games site once (from the `site/` submodule) and share
  # the result with every platform job below, so the (slow) Closure Compiler
  # build is not repeated for x64, x86 and arm64.
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the Blockly Games site
        run: npm run build:site -- --force

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: blockly-games-site
          path: site/offline/blockly-games

  build-windows:
    name: Windows ${{ matrix.arch }}
    needs: build-site
    runs-on: windows-latest
    # `contents: write` is required to create the GitHub Release and upload assets.
    permissions:
      contents: write
    strategy:
      # Don't let one architecture's failure hide the others' results.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Keep a separate cache per architecture so the jobs don't thrash
          # each other's `target` directory.
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # Place the pre-built site where tauri.conf.json expects it, so the
      # `beforeBuildCommand` (a no-op when the site already exists) does not
      # recompile anything.
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: blockly-games-site
          path: site/offline/blockly-games

      # Pull requests only build (fork PRs get a read-only token and must not
      # publish).
      - name: Build
        if: github.event_name == 'pull_request'
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }}
          retryAttempts: 3
          uploadWorkflowArtifacts: true

      # Everything else (main pushes, `v*` tags, manual runs) builds *and*
      # publishes a GitHub Release. All three architectures upload their
      # installers to the same release (the per-arch file names differ, so
      # there are no collisions); `retryAttempts` covers the concurrent
      # "find or create the release" race.
      #  - On a tag, the release uses that tag.
      #  - Otherwise `v__VERSION__` is used, where `__VERSION__` is replaced
      #    with the app version from `src-tauri/tauri.conf.json`.
      - name: Build and publish release
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Blockly Games __VERSION__'
          releaseBody: 'Offline Windows installers for Google''s Blockly Games (x64, x86 and arm64). Blockly Games is Apache-2.0 licensed.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
          retryAttempts: 3
          uploadWorkflowArtifacts: true

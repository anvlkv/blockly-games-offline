name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only keep the most recent run per ref (branches/PRs); never cancel a tag build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    # `contents: write` is required to create the GitHub Release and upload assets.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # Pull requests only build (fork PRs get a read-only token and must not
      # publish). `tauri-action` runs `tauri build`, which executes
      # `beforeBuildCommand` (downloading the full Blockly Games site) first.
      - name: Build
        if: github.event_name == 'pull_request'
        uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true

      # Everything else (main pushes, `v*` tags, manual runs) builds *and*
      # publishes a GitHub Release with the installers attached.
      #  - On a tag, the release uses that tag.
      #  - Otherwise `v__VERSION__` is used, where `__VERSION__` is replaced
      #    with the app version from `src-tauri/tauri.conf.json`.
      - name: Build and publish release
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Blockly Games __VERSION__'
          releaseBody: 'Offline Windows installers for Google''s Blockly Games (Blockly Games is Apache-2.0 licensed).'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadWorkflowArtifacts: true
